<div class="bg-black min-h-screen font-mono">

  <!-- Ventana -->
  <div class="fixed inset-0 flex items-center justify-center " *ngIf="activeWindow">
    <div
      class="flex flex-col w-[400px] border-2 border-[#808080] shadow-[8px_8px_0px_rgba(0,0,0,0.5)] bg-[#c0c0c0] font-mono">

      <!-- Título de ventana -->
      <div class="flex items-center justify-between px-2 py-1 bg-[#800000] text-white">
        <div class="text-sm font-bold tracking-tight">Tequila!</div>
        <div class="flex space-x-1">
          <button class="w-4 h-4 bg-[#c0c0c0] border border-[#808080] flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-3 h-3" stroke="black" fill="none">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button class="w-4 h-4 bg-[#c0c0c0] border border-[#808080] flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-3 h-3" stroke="black" fill="none">
              <rect width="18" height="18" x="3" y="3" rx="2" />
            </svg>
          </button>
          <button (click)="closeWindow()"
            class="w-4 h-4 bg-[#c0c0c0] border border-[#808080] flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-3 h-3" stroke="black" fill="none">
              <path d="M18 6 6 18" />
              <path d="M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Menú falso -->
      <div class="flex text-xs border-b border-[#808080] bg-[#c0c0c0]">
        <button class="px-2 py-0.5 hover:bg-[#800000] hover:text-white">File</button>
        <button class="px-2 py-0.5 hover:bg-[#800000] hover:text-white">Edit</button>
        <button class="px-2 py-0.5 hover:bg-[#800000] hover:text-white">View</button>
        <button class="px-2 py-0.5 hover:bg-[#800000] hover:text-white">Help</button>
      </div>

      <!-- Contenido con GIF -->
      <div
        class="flex-1 p-4 bg-white flex flex-col items-center justify-center text-center border border-[#808080] m-2">
        <img src="assets/maxwell-spinning.gif" alt="GIF decorativo" class="saturate-200 hue-rotate-300" />
        <p class="text-sm text-red-500">WELCOME TO THE SHIGERU ZONE!</p>
      </div>

      <!-- Barra de estado -->
      <div class="flex items-center px-2 py-0.5 text-xs border-t border-[#dfdfdf] bg-[#c0c0c0]">
        <div class="flex-1">Ok</div>
        <div
          class="border border-[#808080] bg-[#c0c0c0] px-1 py-0.5 shadow-[inset_1px_1px_#fff,inset_-1px_-1px_#808080]">
          <div class="w-20 h-2 bg-[#808080]"></div>
        </div>
      </div>

    </div>
  </div>

</div>
